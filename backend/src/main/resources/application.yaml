spring:
  application:
    name: connectpro-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/connectpro
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

connectpro:
  security:
    jwt:
      access-token-expiration: 900
      refresh-token-expiration: 2592000
      issuer: connectpro
      audience: connectpro-api
      key-id: connectpro-access-2026-01
      public-key: ${JWT_PUBLIC_KEY_BASE64}
      private-key: ${JWT_PRIVATE_KEY_BASE64}

  websocket:
    allowed-origins: "${CONNECTPRO_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}"
